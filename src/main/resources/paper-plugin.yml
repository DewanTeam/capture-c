name: SuperpowerPlugin
version: '1.0.0'
main: com.bushsmp.superpower.SuperpowerPlugin
api-version: '26.1.2'
description: "Family-network plugin with optional Superpower and RankShop modules. Commands when enabled: /superpower, /superpower shop, /superpower buy <power_id>, /superpower dismiss, /superpower reload, /rankshop, /rankshop buy <rank_id>, /rankshop gift <player> <rank_id>, /rankshop benefits."
dependencies:
  server:
    Vault:
      load: BEFORE
      required: true
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
    CommandAPI:
      load: BEFORE
      required: true
      join-classpath: true
    Essentials:
      load: BEFORE
      required: false
      join-classpath: true
    DialogEngine:
      load: BEFORE
      required: false
      join-classpath: true