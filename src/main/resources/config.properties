# Velocity/PaperProxy half of the universal SuperpowerPlugin JAR.
# The proxy module is disabled until the same cookie key and backend IDs have
# been configured on all participating backends.
origin-router.enabled=false

cookie.namespace=network
cookie.key=origin_server
cookie.request-timeout-ms=1500

# Keep the root-domain default server unchanged when a cookie is unavailable.
fallback-server=bushsmp

# Exact server names from [servers] in velocity.toml; never add arbitrary client values.
allowed-servers=bushsmp,ucahub,daybreak,riely

log.cookie-decisions=true
