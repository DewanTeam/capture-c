economy:
  currency-name: coins

superpowers:
  magneto:
    enabled: true
    name: Magneto
    description: Hover five blocks above your starting position.
    price: 5000.0
    duration: 30
    height: 5
  firey:
    enabled: true
    name: Firey
    description: Launch a harmless particle-only fireball visual during Firey mode.
    price: 8000.0
    duration: 30
    visual-cooldown: 5
  frozen:
    enabled: true
    name: Frozen
    description: Freeze nearby players for a short duration.
    price: 6000.0
