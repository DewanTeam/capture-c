    radius: 10
    freeze-duration: 3
  arise:
    enabled: true
    name: Arise
    description: Summon temporary undead mobs; seven wear enchanted Netherite armor.
    price: 15000.0
    duration: 30
    mob-count: 20
    enchanted-count: 7
    armor-tier: NETHERITE
  flash:
    enabled: true
    name: Flash
    description: Gain a powerful Speed effect.
    price: 4000.0
    duration: 30
    amplifier: 19
  hulk:
    enabled: true
    name: Hulk
    description: Gain Jump Boost V, Strength II and temporary fall-damage immunity.
    price: 7000.0
    duration: 30
    jump-amplifier: 4
    strength-amplifier: 1

# Power cooldowns are separate from timed effect durations.
# Firey's particle visual uses its own five-second shot interval.
cooldowns:
  default: 1800
  magneto: 1800
  frozen: 1800
  arise: 1800
  flash: 1800
  hulk: 1800

