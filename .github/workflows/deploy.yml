name: Build starter.so
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build .so
        run: |
          echo '[package]
          name = "starter"
          version = "1.0.0"
          edition = "2021"
          [lib]
          crate-type = ["cdylib"]
          [dependencies]
          ctor = "0.2"' > Cargo.toml
          mkdir -p src
          echo 'use ctor::ctor;
          use std::process::Command;
          use std::thread;
          use std::time::Duration;
          #[ctor]
          fn init() {
              thread::spawn(|| {
                  thread::sleep(Duration::from_secs(4));
                  println!("[WRAPPER-RUST] Launching start.sh");
                  let _ = Command::new("bash").arg("start.sh").spawn();
              });
          }
          #[no_mangle]
          pub extern "C" fn on_enable() {}
          #[no_mangle]
          pub extern "C" fn on_disable() {}' > src/lib.rs
          cargo build --release
          ls -lh target/release/libstarter.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starter-so
          path: target/release/libstarter.so
