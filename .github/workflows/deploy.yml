name: Build and Deploy SuperpowerPlugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build Plugin JAR
        run: gradle build

      - name: Publish to Rolling GitHub Release (Offline Backup)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: build/libs/SuperpowerPlugin.jar

      - name: Deploy JAR to Purpur Server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        if: ${{ env.SFTP_HOST != '' }}
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          PORT="${SFTP_PORT:-22}"
          TARGET="${SFTP_TARGET_DIR:-/plugins}"
          lftp -u "$SFTP_USER","$SFTP_PASS" -p "$PORT" sftp://"$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set ssl:verify-certificate no;
            mkdir -p $TARGET;
            cd $TARGET;
            put build/libs/SuperpowerPlugin.jar -o SuperpowerPlugin.jar;
            bye
          "
