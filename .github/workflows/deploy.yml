name: SuperpowerPlugin CI, Release and Deploy

on:
  push:
    branches:
      - main
      - feature/superpower-plugin
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superpower-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 25 and Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.5.1+2'
          cache: gradle

      - name: Set up Gradle for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Generate the real Gradle Wrapper when missing
        shell: bash
        run: |
          if [ ! -s gradlew ] || [ ! -s gradlew.bat ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.properties ]; then
            gradle wrapper --gradle-version 9.9.2 --distribution-type bin
          fi
          chmod +x gradlew
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Verify Java and Gradle Wrapper versions
        run: |
          java -version
          javac -version
          ./gradlew --version

      - name: Build plugin
        run: ./gradlew --no-daemon clean build

      - name: Upload plugin JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SuperpowerPlugin
          path: |
            build/libs/SuperpowerPlugin.jar
            manager/build/libs/ANOBank-PaperProxy-Manager.jar
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Gradle Wrapper to the branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper is already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: add Gradle Wrapper 9.9.2 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  publish-and-deploy:
    name: Publish GitHub Release and deploy over SFTP
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
    steps:
      - name: Download the tested JARs
        uses: actions/download-artifact@v8
        with:
          name: SuperpowerPlugin
          path: dist

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          files: |
            dist/build/libs/SuperpowerPlugin.jar
            dist/manager/build/libs/ANOBank-PaperProxy-Manager.jar
          make_latest: true

      - name: Deploy plugin JAR to Purpur server over SFTP
        if: env.SFTP_HOST != ''
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          PORT="${SFTP_PORT:-22}"
          TARGET="${SFTP_TARGET_DIR:-/plugins}"

          lftp -u "$SFTP_USER","$SFTP_PASS" -p "$PORT" "sftp://$SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          mkdir -p "$TARGET"
          cd "$TARGET"
          put "dist/build/libs/SuperpowerPlugin.jar" -o "SuperpowerPlugin.jar"
          bye
          EOF
