name: Build and Deploy SuperpowerPlugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build Plugin JAR
        run: gradle build

      - name: Publish to Rolling GitHub Release (Offline Backup)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: build/libs/SuperpowerPlugin.jar

      - name: Deploy JAR to Purpur Server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        if: ${{ env.SFTP_HOST != '' }}
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          source: "build/libs/SuperpowerPlugin.jar"
          target: ${{ env.SFTP_TARGET_DIR || '/plugins' }}
          strip_components: 2
