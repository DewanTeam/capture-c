name: build
on: [pull_request, push]

jobs:
  # Detect which subprojects changed so we only build what is affected
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mod: ${{ steps.filter.outputs.mod }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mod:
              - 'mod/**'
              - '.github/workflows/build.yml'
            renderer:
              - 'renderer/**'
              - '.github/workflows/build.yml'

  mod:
    needs: changes
    if: ${{ needs.changes.outputs.mod == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CyberCapture-mod
          path: mod/build/libs/

  renderer:
    needs: changes
    if: ${{ needs.changes.outputs.renderer == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: renderer
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: mvn -B --no-transfer-progress package
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cyber-renderer
          path: renderer/target/*-jar-with-dependencies.jar
